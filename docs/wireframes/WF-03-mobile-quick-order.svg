  <text x="296" y="688" font-size="14" font-weight="700" fill="#0F2044">₩345,800</text>
  <!-- VAT: policy pending -->
  <text x="20" y="706" font-size="10" fill="#9CA3AF">부가세 (DEMO - tax_exclusive 예시)</text>
  <text x="316" y="706" font-size="10" fill="#9CA3AF">₩34,580</text>
  <text x="20" y="724" font-size="13" font-weight="700" fill="#111827">합계</text>
  <text x="290" y="724" font-size="16" font-weight="700" fill="#0F2044">₩380,380</text>

  <!-- CTA Buttons -->
  <rect x="12" y="748" width="174" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="58" y="778" font-size="13" fill="#4B5563">저장</text>
  <!-- CTA: disabled when error rows exist -->
  <rect x="198" y="748" width="178" height="52" rx="8" fill="#9CA3AF"/>
  <text x="214" y="768" font-size="11" fill="#FFFFFF" font-weight="700">오류 2건 해결 후</text>
  <text x="218" y="784" font-size="11" fill="#FFFFFF" font-weight="700">주문 요청 가능</text>

  <!-- Bottom Nav -->
  <rect x="0" y="1144" width="390" height="56" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <!-- [Home icon] text substitute for emoji -->
  <rect x="8" y="1148" width="60" height="40" rx="4" fill="#EFF6FF"/>
  <text x="20" y="1168" font-size="11" fill="#0F2044" font-weight="600">[홈]</text>
  <text x="20" y="1186" font-size="10" fill="#0F2044">홈</text>
  <!-- [Category] -->
  <text x="96" y="1170" font-size="11" fill="#9CA3AF">[카테고리]</text>
  <text x="96" y="1188" font-size="10" fill="#9CA3AF">카테고리</text>
  <!-- Quick order: active -->
  <rect x="156" y="1140" width="78" height="64" rx="8" fill="#C2410C"/>
  <text x="170" y="1166" font-size="11" fill="#FFFFFF" font-weight="700">[빠른주문]</text>
  <text x="168" y="1184" font-size="10" fill="#FFFFFF" font-weight="700">빠른주문</text>
  <!-- [Orders] -->
  <text x="252" y="1170" font-size="11" fill="#9CA3AF">[주문내역]</text>
  <text x="254" y="1188" font-size="10" fill="#9CA3AF">주문내역</text>
  <!-- [My] -->
  <text x="336" y="1170" font-size="11" fill="#9CA3AF">[마이]</text>
  <text x="336" y="1188" font-size="10" fill="#9CA3AF">마이</text>

  <text x="12" y="1196" font-size="9" fill="#9CA3AF">WF-03 · 모바일 빠른 주문 · 390px · TUL B2B Platform · DEMO DATA</text>

</svg>
