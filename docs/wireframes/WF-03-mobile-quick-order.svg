  <rect x="36" y="458" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="46" y="476" font-size="11" fill="#B45309" font-weight="600">10으로 맞추기</text>

  <!-- ROW 5 - Empty row (add more) -->
  <rect x="12" y="460" width="366" height="52" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="160" y="490" font-size="12" fill="#9CA3AF">+ 행 추가</text>

  <!-- Add row button -->
  <rect x="12" y="520" width="174" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="44" y="544" font-size="12" fill="#4B5563">+ 행 추가</text>
  <rect x="198" y="520" width="178" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="222" y="544" font-size="12" fill="#4B5563">📋 엑셀로 붙여넣기</text>

  <!-- AUTOCOMPLETE SUGGESTION DROPDOWN -->
  <rect x="36" y="484" width="144" height="0" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

  <!-- ORDER SUMMARY -->
  <rect x="0" y="572" width="390" height="8" fill="#EAECEF"/>
  <rect x="12" y="588" width="366" height="148" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="20" y="612" font-size="14" font-weight="700" fill="#111827">주문 요약</text>
  <text x="20" y="636" font-size="12" fill="#4B5563">유효한 행</text>
  <text x="340" y="636" font-size="12" fill="#111827" font-weight="600">3행</text>
  <text x="20" y="656" font-size="12" fill="#4B5563">오류 행</text>
  <text x="332" y="656" font-size="12" fill="#DC2626" font-weight="600">2행 ⚠</text>
  <line x1="20" y1="668" x2="370" y2="668" stroke="#EAECEF" stroke-width="1"/>
