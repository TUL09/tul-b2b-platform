  <text x="276" y="294" font-size="11" fill="#E8610A" font-weight="700">₩9,000</text>
  <text x="340" y="288" font-size="16" fill="#9CA3AF">✕</text>

  <!-- ROW 3 - Error state: product not found -->
  <rect x="12" y="316" width="366" height="72" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="20" y="356" font-size="12" fill="#9CA3AF">3</text>
  <rect x="36" y="324" width="144" height="44" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="44" y="344" font-size="12" fill="#DC2626">UNKNOWN-999</text>
  <text x="44" y="360" font-size="10" fill="#DC2626">상품을 찾을 수 없습니다</text>
  <rect x="188" y="328" width="36" height="32" rx="4" fill="#F4F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="196" y="348" font-size="12" fill="#9CA3AF">-</text>
  <rect x="228" y="328" width="44" height="32" rx="4" fill="#F4F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="240" y="348" font-size="12" fill="#9CA3AF">-</text>
  <text x="280" y="348" font-size="11" fill="#9CA3AF">-</text>
  <text x="346" y="348" font-size="16" fill="#DC2626">✕</text>
