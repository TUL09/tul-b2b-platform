  <text x="36" y="380" font-size="10" fill="#DC2626">⚠ 상품코드·모델명을 확인하거나 견적요청을 이용하세요</text>

  <!-- ROW 4 - MOQ error -->
  <rect x="12" y="388" width="366" height="72" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="20" y="428" font-size="12" fill="#9CA3AF">4</text>
  <rect x="36" y="396" width="144" height="44" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="44" y="416" font-size="12" fill="#111827">DS-PH2</text>
  <text x="44" y="430" font-size="10" fill="#16A34A">■ TTC 드라이버 PH#2</text>
  <rect x="188" y="400" width="36" height="32" rx="4" fill="#FFFFFF" stroke="#0F2044" stroke-width="1.5"/>
  <text x="196" y="420" font-size="12" fill="#0F2044" font-weight="600">EA</text>
  <rect x="228" y="400" width="44" height="32" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="240" y="420" font-size="13" fill="#DC2626" font-weight="600">3</text>
  <text x="280" y="420" font-size="11" fill="#9CA3AF">MOQ 10</text>
  <text x="346" y="420" font-size="16" fill="#9CA3AF">✕</text>
  <text x="36" y="452" font-size="10" fill="#B45309">▲ MOQ 10 이상 필요 (현재 3개 입력)</text>
