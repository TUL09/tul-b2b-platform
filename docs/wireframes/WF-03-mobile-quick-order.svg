<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1200" viewBox="0 0 390 1200" font-family="Arial, sans-serif">
  <rect width="390" height="1200" fill="#F4F5F7"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="390" height="56" fill="#0F2044"/>
  <text x="16" y="35" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="2">TUL</text>
  <text x="130" y="35" font-size="13" fill="#FFFFFF" font-weight="600">⚡ 빠른 주문</text>

  <!-- Description -->
  <rect x="0" y="56" width="390" height="40" fill="#1E2A38"/>
  <text x="16" y="80" font-size="12" fill="#9CA3AF">상품코드·모델명 직접 입력 또는 이전 주문 불러오기</text>

  <!-- IMPORT FROM PREVIOUS ORDER -->
  <rect x="12" y="108" width="366" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="16" y="120" font-size="10" fill="#9CA3AF">📋</text>
  <text x="32" y="134" font-size="13" fill="#4B5563" font-weight="600">이전 주문 불러오기</text>
  <text x="290" y="134" font-size="12" fill="#E8610A">ORD-0847 ›</text>

  <!-- QUICK ORDER TABLE HEADER -->
  <rect x="12" y="164" width="366" height="32" rx="4" fill="#1E2A38"/>
  <text x="20" y="184" font-size="10" fill="#9CA3AF" font-weight="600">#</text>
  <text x="40" y="184" font-size="10" fill="#9CA3AF" font-weight="600">상품코드 / 모델명</text>
  <text x="192" y="184" font-size="10" fill="#9CA3AF" font-weight="600">UOM</text>
  <text x="232" y="184" font-size="10" fill="#9CA3AF" font-weight="600">수량</text>
  <text x="280" y="184" font-size="10" fill="#9CA3AF" font-weight="600">단가</text>
  <text x="340" y="184" font-size="10" fill="#9CA3AF" font-weight="600">삭제</text>

  <!-- ROW 1 - Valid -->
  <rect x="12" y="196" width="366" height="60" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="20" y="230" font-size="12" fill="#9CA3AF">1</text>
  <rect x="36" y="204" width="144" height="44" rx="4" fill="#F4F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="44" y="224" font-size="12" fill="#111827">N-150</text>
  <text x="44" y="238" font-size="10" fill="#16A34A">■ TTC 니퍼 150mm</text>
  <!-- UOM selector -->
  <rect x="188" y="208" width="36" height="32" rx="4" fill="#FFFFFF" stroke="#0F2044" stroke-width="1.5"/>
  <text x="196" y="228" font-size="12" fill="#0F2044" font-weight="600">EA</text>
  <!-- Quantity -->
  <rect x="228" y="208" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="240" y="228" font-size="13" fill="#111827">20</text>
  <!-- Price: N-150 qty=20 → tier 2 → ₩11,500 -->
  <text x="280" y="228" font-size="11" fill="#E8610A" font-weight="600">₩11,500</text>
  <text x="280" y="242" font-size="8" fill="#9CA3AF">10개이상 구간</text>
  <!-- Delete -->
  <text x="346" y="228" font-size="16" fill="#9CA3AF">✕</text>

  <!-- ROW 2 - Valid with tiered price -->
  <rect x="12" y="256" width="366" height="60" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="20" y="290" font-size="12" fill="#9CA3AF">2</text>
  <rect x="36" y="264" width="144" height="44" rx="4" fill="#F4F5F7" stroke="#D1D5DB" stroke-width="1"/>
  <text x="44" y="284" font-size="12" fill="#111827">LB-10</text>
  <text x="44" y="298" font-size="10" fill="#16A34A">■ OLFA 커터날 LB-10</text>
  <rect x="188" y="268" width="36" height="32" rx="4" fill="#FFFFFF" stroke="#0F2044" stroke-width="1.5"/>
  <text x="192" y="288" font-size="11" fill="#0F2044" font-weight="600">PACK</text>
  <rect x="228" y="268" width="44" height="32" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="240" y="288" font-size="13" fill="#111827">10</text>
